<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-label="Aditya Arun, datasheet header">
  <style>
    :root { --bg:#0f1114; --ink:#ecebe6; --mute:#8b8d93; --rule:#2a2d33; --accent:#ff8a4c; }
    .bg { fill:var(--bg); } .rule { stroke:var(--rule); stroke-width:1; fill:none; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .tiny { font-size:11px; letter-spacing:2px; fill:var(--mute); }
    .name { font-family: Georgia, "Times New Roman", serif; font-size:64px; fill:var(--ink); letter-spacing:-1px; }
    .key { font-size:12px; letter-spacing:1.5px; fill:var(--mute); }
    .val { font-size:14px; fill:var(--ink); }
    .cur { fill:var(--accent); animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation:none; } }
  </style>
  <rect class="bg" width="900" height="230" rx="6"/>
  <rect class="rule" x="0.5" y="0.5" width="899" height="229" rx="6"/>
  <text class="mono tiny" x="32" y="36">DATASHEET</text>
  <text class="mono tiny" x="868" y="36" text-anchor="end">REV 2026.10</text>
  <line class="rule" x1="32" y1="50" x2="868" y2="50"/>
  <text class="name" x="30" y="122">Aditya Arun</text>
  <rect class="cur" x="376" y="76" width="5" height="52"/>
  <line class="rule" x1="32" y1="150" x2="868" y2="150"/>
  <g class="mono">
    <text class="key" x="32" y="178">FOCUS</text>
    <text class="val" x="32" y="200">LLM agents, computer vision</text>
    <text class="key" x="330" y="178">BUILDS</text>
    <text class="val" x="330" y="200">full-stack, shipped live</text>
    <text class="key" x="620" y="178">STATUS</text>
    <text class="val" x="620" y="200">CS undergrad, semester 3</text>
  </g>
</svg>
